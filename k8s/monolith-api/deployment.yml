apiVersion: apps/v1
kind: Deployment
metadata:
  name: monolith-api
  namespace: oficina
  labels:
    app.kubernetes.io/name: monolith-api
    app.kubernetes.io/part-of: techchallenge-oficina
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: monolith-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: monolith-api
        app.kubernetes.io/part-of: techchallenge-oficina
    spec:
      imagePullSecrets:
        - name: ecr-regcred
      containers:
        - name: monolith-api
          image: 903936907231.dkr.ecr.us-east-1.amazonaws.com/techchallenge-oficina-monolith:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: monolith-api-config
            - secretRef:
                name: monolith-api-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
